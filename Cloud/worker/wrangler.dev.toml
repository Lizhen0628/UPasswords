name = "upasswords-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"
# mysql2(Hyperdrive 官方 MySQL 驱动)依赖 Node API
compatibility_flags = ["nodejs_compat"]

# 绑定到 upasswords.com 的 Workers 自定义域(域名托管在 Cloudflare)

# Hyperdrive:连接自管 MariaDB(kvm-database 24.233.2.194:6033,库 upasswords);
# 配置 id=d6073cfc…(口令只存 CF 控制面);自签证书如握手校验失败,
# 经控制台「Server certificates」上传启用 Verify,或改走 Tunnel(DESIGN §8.3)
binding = "DB"
id = "d6073cfc1e9e4066b5d983622ebd37ae"

# R2:附件密文 blob(vaults/<id>/attachments/…)+ 网站目录图标(sites/icons/…)
[[r2_buckets]]
binding = "VAULTS"
bucket_name = "upasswords"

# 每日 04:00 UTC:注销到期清除、变更日志保留+地板推进、rekey 过期清理、
# 附件孤儿清扫、staging 清扫、计数对账、审计保留
[triggers]
crons = ["0 4 * * *"]

[vars]
SMTP_HOST = "smtp.163.com"
SMTP_PORT = "465"
SMTP_FROM = "16621660628@163.com"
SMTP_REPLY_TO = "register@upasswords.com"
VAULT_LIMIT_PER_USER = "10"
ITEM_BODY_MAX_BYTES = "2097152"
ITEMS_PER_VAULT_LIMIT = "50000"
ITEMS_BATCH_MAX = "200"
ATTACHMENT_MAX_BYTES = "20971520"
ATTACH_QUOTA_PER_VAULT = "524288000"
ATTACH_STAGING_MAX_OBJECTS = "8"
CHANGE_RETENTION_DAYS = "90"
REKEY_TTL_MS = "3600000"
SITES_ICON_MAX_BYTES = "65536"
BREACH_CACHE_TTL_SECONDS = "86400"
CODE_TTL_SECONDS = "600"
CODE_RESEND_COOLDOWN_SECONDS = "60"
CODE_HOURLY_PER_EMAIL = "10"
CODE_HOURLY_PER_IP = "20"
CODE_MAX_ATTEMPTS = "5"
SESSION_TTL_DAYS = "90"
DEREGISTER_PURGE_DAYS = "30"

# Secrets(绝不写入本文件):
#   APP_KEK      64 hex — 应用层加密主键(信封/邮箱加密、键控哈希)
#   ADMIN_TOKEN  统计/目录管理面凭据
#   SMTP_USER / SMTP_PASSWORD  163 发件账号与授权码
# 经 `npx wrangler secret put <NAME>` 配置;测试环境经 env 对象注入。
