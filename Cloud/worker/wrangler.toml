name = "upasswords-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# 绑定到 upasswords.com 的 Workers 自定义域(域名托管在 Cloudflare)
routes = [{ pattern = "api.upasswords.com", custom_domain = true }]

# D1:首次部署前 `npx wrangler d1 create upasswords-sync`,把返回的 database_id
# 回填到下方(REPLACE_AFTER_D1_CREATE);迁移经 `npx wrangler d1 migrations apply upasswords-sync --remote`
[[d1_databases]]
binding = "DB"
database_name = "upasswords-sync"
database_id = "3240f9c2-2b0c-454a-a198-567e3d405b63"
migrations_dir = "migrations"

# R2:库体密文对象存储(standalone Safari 扩展数据通路)。首次部署前
# `npx wrangler r2 bucket create upasswords`;存的是 VEK 加密密文,
# 服务器零知识,对象不可解。键空间:vaults/{vaultId} 生效副本、
# vaults/staging/{vaultId}/{uploadId} 上传暂存(日度 cron 清扫)。
[[r2_buckets]]
binding = "VAULTS"
bucket_name = "upasswords"

# 每日 04:00 UTC:注销账户 30 天保留期到期的物理清除 + staging 孤儿清扫
[triggers]
crons = ["0 4 * * *"]

[vars]
SMTP_HOST = "smtp.163.com"
SMTP_PORT = "465"
SMTP_FROM = "16621660628@163.com"
SMTP_REPLY_TO = "register@upasswords.com"
VAULT_LIMIT_PER_USER = "10"
VAULT_BODY_MAX_BYTES = "52428800"
CODE_TTL_SECONDS = "600"
CODE_RESEND_COOLDOWN_SECONDS = "60"
CODE_HOURLY_PER_EMAIL = "10"
CODE_HOURLY_PER_IP = "20"
CODE_MAX_ATTEMPTS = "5"
SESSION_TTL_DAYS = "90"
DEREGISTER_PURGE_DAYS = "30"
CHANGED_AT_MAX_SKEW_SECONDS = "300"

# Secrets(绝不写入本文件):
#   APP_KEK      64 hex — 应用层加密主键(信封/邮箱加密、键控哈希),丢失=信封不可解(客户端回退网盘信封)
#   ADMIN_TOKEN  统计端点凭据
#   SMTP_USER / SMTP_PASSWORD  163 发件账号与授权码
# 经 `npx wrangler secret put <NAME>` 配置;测试环境经 vitest.config.ts 的 bindings 注入。
