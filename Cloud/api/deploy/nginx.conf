# Install into nginxui /etc/nginx/sites-available/api.upasswords.com after issuing its certificate.
# No request/query/body/token logging for this password API.
server {
    listen 443 ssl;
    http2 on;
    server_name api.upasswords.com;
    ssl_certificate /etc/nginx/ssl/api.upasswords.com_RSA/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/api.upasswords.com_RSA/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 20m;
    client_body_timeout 30s;
    location /health/ { return 404; }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
        proxy_send_timeout 45s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
