name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          # node 24 自带 npm 11:`npm install-scripts approve`(生命周期脚本
          # 白名单)是 npm 11.5+ 的命令,node 22 的 npm 10 会报 Unknown command
          node-version: 24
          cache: npm
          cache-dependency-path: Cloud/worker/package-lock.json
      - name: Install deps
        working-directory: Cloud/worker
        run: |
          npm ci
          npm install-scripts approve esbuild >/dev/null
          npm install-scripts approve workerd >/dev/null
      - name: Typecheck
        working-directory: Cloud/worker
        run: npm run typecheck
      - name: Test (vitest + miniflare D1)
        working-directory: Cloud/worker
        run: npm test

  build-and-test:
    # macos-26 = Xcode 26 / Swift 6.x,与本地开发工具链一致,避免 SDK 隔离检查差异
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build & test library packages
        run: |
          for pkg in Core Persistence Networking; do
            echo "==> SwiftPackages/$pkg"
            (cd "SwiftPackages/$pkg" && swift build && swift test)
          done
      - name: Build & test macOS app package
        run: |
          cd Apple/macOS
          swift build
          swift test
      - name: Build Xcode workspace (macOS + iOS + Safari extension)
        run: |
          # 新版 runner 镜像不再预装 xcodegen,按需安装
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd Apple && xcodegen generate)
          xcodebuild -workspace UPasswords.xcworkspace -scheme UPasswords-macOS \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -workspace UPasswords.xcworkspace -scheme UPasswords-iOS \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build web extensions
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Bundle .app (release)
        run: ./scripts/make-app.sh dist
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: UPasswords-app
          path: dist/UPasswords.app
