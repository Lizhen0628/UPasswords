name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: upasswords_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      UPW_TEST_DSN: root@tcp(127.0.0.1:3306)/upasswords_test?multiStatements=true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: Cloud/api/go.sum
      - name: Test Go API
        working-directory: Cloud/api
        run: go test -race -count=1 ./... && go vet ./...

  build-and-test:
    # macos-26 = Xcode 26 / Swift 6.x,与本地开发工具链一致,避免 SDK 隔离检查差异
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build & test library packages
        run: |
          for pkg in Core Persistence Networking; do
            echo "==> SwiftPackages/$pkg"
            (cd "SwiftPackages/$pkg" && swift build && swift test)
          done
      - name: Build & test macOS app package
        run: |
          cd Apple/macOS
          swift build
          swift test
      - name: Build Xcode workspace (macOS + iOS + Safari extension)
        run: |
          # 新版 runner 镜像不再预装 xcodegen,按需安装
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd Apple && xcodegen generate)
          xcodebuild -workspace UPasswords.xcworkspace -scheme UPasswords-macOS \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -workspace UPasswords.xcworkspace -scheme UPasswords-iOS \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build web extensions
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Bundle .app (release)
        run: ./scripts/make-app.sh dist
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: UPasswords-app
          path: dist/UPasswords.app
