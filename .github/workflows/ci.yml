name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle .app (release)
        run: ./scripts/make-app.sh dist
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: UPasswords-app
          path: dist/UPasswords.app
