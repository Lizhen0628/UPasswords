name: CI

on:
  push:
    branches: [main, tauri-vue3-rewrite]
  pull_request:

jobs:
  tauri:
    name: Tauri build + tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Frontend tests
        run: pnpm test
      - name: Frontend typecheck + build
        run: pnpm build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --verbose
      - name: Bundle app
        run: pnpm tauri build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: UPasswords-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg

  swift:
    name: Swift build + tests (legacy)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle .app (release)
        run: ./scripts/make-app.sh dist
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPasswords-swift-app
          path: dist/UPasswords.app
