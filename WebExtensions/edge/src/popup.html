<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UPasswords</title>
    <style>
        :root {
            color-scheme: light dark;
            --surface: #ffffff;
            --subtle: #f3f5f9;
            --elevated: #ffffff;
            --text: #1b2230;
            --secondary: #68717f;
            --line: #e5e9f0;
            --accent: #3f7fd4;
            --accent-strong: #2f6cc0;
            --accent-soft: #e9f1fc;
            --on-accent: #ffffff;
            --danger: #c4324b;
            --danger-tint: #fdeef1;
            --success: #1e8a58;
            --success-soft: #e5f5ec;
            --radius-lg: 12px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --shadow: 0 10px 24px rgb(24 42 74 / .10);
            --ring: 0 0 0 3px rgb(63 127 212 / .22);
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
        html, body { width: 440px; min-width: 340px; max-width: 440px; }
        html { overflow: hidden; background: var(--surface); }
        body { height: auto; max-height: 600px; margin: 0; display: flex; flex-direction: column; overflow: hidden; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--surface); -webkit-font-smoothing: antialiased; }
        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }
        button:disabled { opacity: .55; cursor: default; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; box-shadow: var(--ring); border-color: var(--accent); }
        svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

        /* 面板切换动效 */
        @keyframes panel-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .panel:not([hidden]), #itemsBox:not([hidden]), #settingsBox:not([hidden]) { animation: panel-in .18s ease-out; }
        @media (prefers-reduced-motion: reduce) {
            .panel:not([hidden]), #itemsBox:not([hidden]), #settingsBox:not([hidden]) { animation: none; }
            * { transition-duration: .01ms !important; }
        }

        /* 顶栏：品牌 + 库切换 + 状态 + 锁定 */
        .header { display: flex; align-items: center; gap: 10px; min-height: 62px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--surface), var(--subtle)); flex-shrink: 0; }
        .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, #5b9ae4, #2f63ae); border-radius: 10px; box-shadow: 0 3px 8px rgb(47 99 174 / .35), inset 0 1px 0 rgb(255 255 255 / .25); flex-shrink: 0; }
        .brand-copy { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
        h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
        .vault-name { display: inline-flex; align-items: center; gap: 2px; min-width: 0; max-width: 100%; padding: 1px 5px; margin-left: -5px; border: 0; border-radius: 6px; color: var(--secondary); background: transparent; text-align: left; font-size: 12px; overflow: hidden; white-space: nowrap; }
        .vault-name span:first-child { overflow: hidden; text-overflow: ellipsis; }
        .vault-name:empty { display: none; }
        #switchVaultButton { cursor: pointer; }
        #switchVaultButton:hover { color: var(--accent); background: var(--accent-soft); }
        .state-badge { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; max-width: 92px; padding: 4px 9px; border-radius: 999px; background: var(--subtle); border: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .state-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
        body[data-panel="items"] .state-badge, body[data-panel="detail"] .state-badge, body[data-panel="settings"] .state-badge, body[data-panel="generator"] .state-badge, body[data-panel="new-login"] .state-badge { color: var(--success); background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 28%, transparent); }
        body:not([data-panel="unlock"]):not([data-panel="items"]):not([data-panel="settings"]):not([data-panel="detail"]):not([data-panel="generator"]):not([data-panel="new-login"]) .state-badge,
        body:not([data-panel="unlock"]):not([data-panel="items"]):not([data-panel="settings"]):not([data-panel="detail"]):not([data-panel="generator"]):not([data-panel="new-login"]) .vault-name { display: none; }
        body:not([data-panel="items"]) .site-context { display: none; }
        #headerTools { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
        #lockNowButton { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid transparent; border-radius: 9px; color: var(--secondary); background: transparent; transition: background .12s, color .12s; }
        #lockNowButton:hover { color: var(--text); background: var(--elevated); border-color: var(--line); box-shadow: 0 1px 3px rgb(24 42 74 / .08); }

        main { min-height: 0; flex: 1 1 auto; max-height: 476px; overflow-y: auto; padding: 16px; scrollbar-gutter: stable; }
        body[data-panel="items"] main { min-height: 340px; padding: 14px 14px 16px; }
        main::-webkit-scrollbar { width: 8px; }
        main::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--secondary) 35%, transparent); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }

        .panel { display: flex; flex-direction: column; gap: 16px; }
        .panel-heading { display: flex; flex-direction: column; gap: 6px; }
        .step { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
        .description { margin: 0; color: var(--secondary); font-size: 13px; overflow-wrap: anywhere; }

        /* 登录 / 解锁 / 选库三屏的品牌区 */
        .hero { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0 2px; text-align: center; }
        .hero-icon { width: 54px; height: 54px; display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, #5b9ae4, #2f63ae); border-radius: 16px; box-shadow: 0 8px 18px rgb(47 99 174 / .30), inset 0 1px 0 rgb(255 255 255 / .25); }
        .hero-icon svg { width: 26px; height: 26px; }
        .hero .step { text-align: center; }
        .hero .description { max-width: 300px; }

        .field { min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--secondary); }
        input, select, textarea { min-width: 0; width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--elevated); color: var(--text); transition: border-color .12s, box-shadow .12s, background .12s; }
        input:hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--secondary) 40%, var(--line)); }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
        input[readonly], textarea[readonly] { background: var(--subtle); border-style: dashed; color: var(--text); }
        textarea { height: auto; resize: vertical; }
        input::placeholder { color: color-mix(in srgb, var(--secondary) 75%, transparent); font-weight: 400; }

        .primary, .secondary { min-height: 42px; border-radius: var(--radius-md); padding: 8px 14px; font-weight: 650; transition: filter .12s, background .12s, border-color .12s, box-shadow .12s; }
        .primary { width: 100%; border: 0; color: var(--on-accent); background: linear-gradient(180deg, #4c8ede, #3370bd); box-shadow: 0 3px 10px rgb(51 112 189 / .30), inset 0 1px 0 rgb(255 255 255 / .22); }
        .primary:hover:not(:disabled) { filter: brightness(1.05); }
        .primary:active:not(:disabled) { filter: brightness(.96); box-shadow: 0 1px 4px rgb(51 112 189 / .30); }
        .secondary { border: 1px solid var(--line); color: var(--text); background: var(--elevated); white-space: normal; box-shadow: 0 1px 2px rgb(24 42 74 / .05); }
        .secondary:hover:not(:disabled) { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); color: var(--accent-strong); }
        .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 144px); align-items: start; gap: 10px; }

        #createVaultForm { display: flex; flex-direction: column; gap: 14px; }
        #vaultList { display: flex; flex-direction: column; gap: 8px; }
        #vaultList:empty { display: none; }
        .vault-row { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--elevated); color: var(--text); font-weight: 650; overflow-wrap: anywhere; box-shadow: 0 1px 2px rgb(24 42 74 / .05); transition: border-color .12s, background .12s, box-shadow .12s; }
        .vault-row:hover { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow); }
        .count { color: var(--secondary); font-size: 12px; font-weight: 450; }
        .unlock-note, .privacy-note { margin: 0; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--line); color: var(--secondary); background: var(--subtle); font-size: 12px; }

        /* 条目页：搜索 / 工具行 / 站点横幅 */
        .search { position: relative; display: block; margin-bottom: 12px; }
        .search svg { position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; color: var(--secondary); pointer-events: none; }
        .search input { min-height: 44px; padding-left: 40px; background: var(--subtle); border-color: transparent; border-radius: var(--radius-lg); }
        .search input:hover { border-color: transparent; background: color-mix(in srgb, var(--subtle) 80%, var(--accent-soft)); }
        .search input:focus { background: var(--elevated); border-color: var(--accent); }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 12px; }
        .toolbar select, .toolbar button { width: auto; min-width: 0; min-height: 34px; padding: 5px 10px; font-size: 12px; border-radius: var(--radius-sm); }
        /* MV3 扩展页 CSP(default-src 'self')禁止 data: 图像,下拉箭头用纯 CSS 三角 */
        .select-shell { position: relative; display: inline-flex; min-width: 0; }
        .select-shell::after { content: ""; position: absolute; right: 11px; top: 50%; width: 0; height: 0; margin-top: -2px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--secondary); pointer-events: none; }
        .select-shell select { flex: 1; appearance: none; -webkit-appearance: none; padding-right: 24px; }
        .toolbar .select-shell { flex: 1 1 108px; }
        .toolbar select { border-color: var(--line); background: var(--elevated); font-weight: 550; color: var(--text); box-shadow: 0 1px 2px rgb(24 42 74 / .05); }
        .toolbar button { flex: 0 0 auto; border: 1px solid var(--line); color: var(--text); background: var(--elevated); font-weight: 550; }
        .toolbar button:hover:not(:disabled) { background: var(--subtle); }
        #newLoginButton { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); color: var(--accent-strong); background: var(--accent-soft); font-weight: 700; }
        #newLoginButton:hover:not(:disabled) { background: color-mix(in srgb, var(--accent-soft) 55%, var(--accent)); border-color: var(--accent); }
        .sync-summary { display: flex; align-items: center; gap: 6px; margin: -4px 0 10px; color: var(--secondary); font-size: 11px; }
        .sync-summary::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--secondary) 55%, transparent); flex-shrink: 0; }

        .site-context { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; padding: 10px 12px; border-radius: var(--radius-lg); border: 1px solid color-mix(in srgb, var(--accent) 26%, var(--line)); background: linear-gradient(180deg, var(--accent-soft), color-mix(in srgb, var(--accent-soft) 55%, var(--surface))); cursor: pointer; transition: border-color .12s, box-shadow .12s; }
        .site-context:hover { border-color: var(--accent); box-shadow: var(--shadow); }
        .site-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; color: var(--accent-strong); background: var(--elevated); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); flex-shrink: 0; }
        .site-icon svg { width: 16px; height: 16px; }
        .site-copy { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
        .site-caption { font-size: 11px; font-weight: 600; color: var(--accent-strong); }
        .host { font-size: 13px; font-weight: 650; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .list-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; color: var(--secondary); }
        .list-heading h2 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
        #resultCount { flex-shrink: 0; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--subtle); border: 1px solid var(--line); text-align: center; font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; }

        /* 条目卡片行：头像按标题着色，可填充行有强调态 */
        ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
        .suggestion-section { margin-bottom: 14px; }
        .item { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 0 4px; padding: 5px 6px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--elevated); box-shadow: 0 1px 2px rgb(24 42 74 / .05); transition: border-color .12s, box-shadow .12s, background .12s; }
        .item:hover, .item:focus-within { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); box-shadow: var(--shadow); }
        .item.match { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 60%, var(--elevated)), var(--elevated)); }
        .item > button:first-child { flex: 1 1 168px; min-width: 0; width: auto; }
        .item button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 54px; text-align: left; padding: 6px 8px; border: 0; border-radius: 9px; background: transparent; color: var(--text); }
        .item button:hover:not(:disabled), .item button:focus-visible { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); }
        .item-avatar { width: 36px; height: 36px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; font-size: 14px; font-weight: 700; color: #fff; background: linear-gradient(150deg, var(--av-a, #5b9ae4), var(--av-b, #2f63ae)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .22); }
        .item-avatar[data-tint="0"] { --av-a: #5b9ae4; --av-b: #2f63ae; }
        .item-avatar[data-tint="1"] { --av-a: #8b7ce0; --av-b: #5c4cae; }
        .item-avatar[data-tint="2"] { --av-a: #4fb8b0; --av-b: #2c7f78; }
        .item-avatar[data-tint="3"] { --av-a: #e2a45c; --av-b: #b0702c; }
        .item-avatar[data-tint="4"] { --av-a: #dd7d9b; --av-b: #a84a6a; }
        .item-avatar[data-tint="5"] { --av-a: #7ba85c; --av-b: #4f7a34; }
        .item-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
        .title, .user { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .title { font-weight: 650; font-size: 13.5px; }
        .user { color: var(--secondary); font-size: 12px; }
        .fill-label, .site-label { flex: 0 0 auto; font-size: 11px; }
        .fill-label { color: var(--accent); }
        .site-label { color: var(--secondary); }
        .item-actions { display: flex; align-items: center; justify-content: flex-end; gap: 3px; flex: 0 0 auto; }
        .item-actions button, .item > .fill-action { width: auto; min-width: 34px; min-height: 32px; padding: 4px 8px; border: 1px solid transparent; border-radius: 8px; color: var(--secondary); background: transparent; font-size: 11px; font-weight: 600; transition: opacity .12s, background .12s, color .12s, border-color .12s; }
        .item-actions button:hover, .item > .fill-action:hover { border-color: var(--line); color: var(--accent-strong); background: var(--elevated); }
        .item-actions .fill-action { color: var(--on-accent); background: linear-gradient(180deg, #4c8ede, #3370bd); border-color: transparent; box-shadow: 0 2px 6px rgb(51 112 189 / .28); }
        .item-actions .fill-action:hover { color: var(--on-accent); background: linear-gradient(180deg, #5494e4, #2f67b4); }
        @media (hover: hover) {
            .item-actions button:not(.fill-action) { opacity: 0; }
            .item:hover .item-actions button, .item:focus-within .item-actions button { opacity: 1; }
        }
        .item .ok { display: block; flex-basis: 100%; margin: 0 8px 6px 54px; color: var(--success); font-size: 12px; font-weight: 600; }

        .empty-state { padding: 28px 18px; text-align: center; background: var(--subtle); border: 1px dashed color-mix(in srgb, var(--secondary) 35%, var(--line)); border-radius: var(--radius-lg); }
        .empty-state svg { width: 34px; height: 34px; margin-bottom: 10px; color: color-mix(in srgb, var(--secondary) 70%, transparent); }
        .empty-state h3 { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
        .empty-state p { margin: 0 0 14px; color: var(--secondary); font-size: 13px; overflow-wrap: anywhere; }
        .empty-state .secondary { width: auto; }

        /* 详情 / 编辑 */
        #detailContent { display: flex; flex-direction: column; gap: 14px; }
        .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .detail-actions .secondary { min-height: 36px; padding: 6px 12px; font-size: 12.5px; }
        #detailBackButton { margin-right: auto; }
        #detailBackButton::before { content: "‹"; margin-right: 2px; font-weight: 700; }
        .detail-value { display: flex; gap: 6px; align-items: start; }
        .detail-value input, .detail-value textarea { flex: 1; min-height: 40px; }
        .detail-value input[type="password"] { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; }
        .detail-value textarea { min-height: 96px; white-space: pre-wrap; }
        .detail-value .secondary { min-height: 40px; min-width: 52px; padding: 6px 10px; font-size: 12px; flex-shrink: 0; }
        #detailSaveSection { display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: var(--radius-lg); background: var(--accent-soft); }
        #detailLegacyNote { margin: 0; }

        /* 设置 */
        #settingsBox { display: flex; flex-direction: column; gap: 16px; }
        body[data-panel="settings"] main { min-height: 260px; }
        .setting-row { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
        .setting-row .select-shell { display: flex; }
        .setting-row select { padding-right: 30px; }
        #persistenceNote, #sessionMode, #accountInfo, #settingsSyncStatus, #clipboardNote { margin: 0; color: var(--secondary); font-size: 12px; overflow-wrap: anywhere; }
        #settingsSyncStatus { padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--subtle); }
        #accountInfo { font-weight: 600; color: var(--text); }

        /* 状态条：成功=中性 pill，错误=红色卡片 */
        #status { margin-top: 12px; font-size: 12px; overflow-wrap: anywhere; }
        #status:empty { display: none; }
        #status.muted { color: var(--secondary); padding: 8px 12px; border-radius: var(--radius-md); background: var(--subtle); border: 1px solid var(--line); }
        #status.error { color: var(--danger); background: var(--danger-tint); border: 1px solid color-mix(in srgb, var(--danger) 25%, transparent); padding: 9px 12px; border-radius: var(--radius-md); font-weight: 550; }

        /* 底部导航与页脚 */
        #navigation { display: flex; gap: 4px; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--surface); flex-shrink: 0; }
        #navigation button { flex: 1; min-width: 0; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 5px 4px; border: 0; border-radius: var(--radius-md); color: var(--secondary); background: transparent; font-size: 11px; font-weight: 600; overflow-wrap: anywhere; transition: background .12s, color .12s; }
        #navigation button svg { width: 19px; height: 19px; }
        #navigation button:hover { color: var(--text); background: var(--subtle); }
        #navigation button[aria-current="page"] { color: var(--accent-strong); background: var(--accent-soft); }
        .footer { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 42px; padding: 5px 12px; border-top: 1px solid var(--line); background: var(--subtle); flex-shrink: 0; }
        .footer button { min-width: 0; border: 0; min-height: 32px; background: transparent; color: var(--secondary); border-radius: 7px; padding: 6px 9px; font-size: 12px; font-weight: 550; }
        .footer button:hover { background: var(--elevated); color: var(--text); box-shadow: 0 1px 2px rgb(24 42 74 / .08); }
        #lockButton { margin-left: auto; }
        #lockButton:hover { color: var(--danger); }

        /* 密码生成器 */
        .generator-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .check-row { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius-md); color: var(--secondary); background: var(--elevated); font-size: 12.5px; font-weight: 550; cursor: pointer; transition: border-color .12s, background .12s, color .12s; }
        .check-row:has(input:checked) { color: var(--accent-strong); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); }
        .check-row input { width: 15px; min-height: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
        .generator-output { position: relative; }
        #generatedPassword { min-height: 52px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 16px; letter-spacing: .04em; text-align: center; background: var(--subtle); }
        #regenerateButton::before { content: "⟳"; margin-right: 6px; font-weight: 700; }
        .clip-note { margin: 0; color: var(--secondary); font-size: 11px; }
        #newLoginBox .privacy-note { margin-top: -4px; }

        @media (max-width: 390px) {
            html, body { width: 360px; }
            .header { gap: 7px; padding-inline: 12px; }
            .state-badge { max-width: 74px; }
            .toolbar select { flex-basis: 96px; }
            main { padding: 14px 12px; }
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --surface: #222221; --subtle: #2b2b29; --elevated: #2f2f2c; --text: #f2f2ef; --secondary: #9b9b94; --line: #3b3c38;
                --accent: #6ea8e6; --accent-strong: #8fbcee; --accent-soft: #2c3a4d; --on-accent: #0f1722;
                --danger: #ff8fa0; --danger-tint: #3d272c; --success: #6fcd9d; --success-soft: #22382e;
                --shadow: 0 10px 24px rgb(0 0 0 / .35); --ring: 0 0 0 3px rgb(110 168 230 / .28);
            }
            .primary, .item-actions .fill-action { background: linear-gradient(180deg, #5b9ae4, #3f7ac4); color: #0f1722; box-shadow: 0 3px 10px rgb(0 0 0 / .35), inset 0 1px 0 rgb(255 255 255 / .18); }
            .primary:hover:not(:disabled), .item-actions .fill-action:hover { color: #0f1722; }
            .brand-mark, .hero-icon { box-shadow: 0 6px 14px rgb(0 0 0 / .4), inset 0 1px 0 rgb(255 255 255 / .18); }
            .item:hover, .item:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4v9a6 6 0 0 0 12 0V4M9 4v9a3 3 0 0 0 6 0V4"/></svg></div>
        <div class="brand-copy">
            <h1>UPasswords</h1>
            <button class="vault-name" id="switchVaultButton" type="button" aria-label="Switch vault" hidden><span id="vaultName"></span><span aria-hidden="true">⌄</span></button>
        </div>
        <span class="state-badge" id="stateBadge"></span>
        <div id="headerTools" hidden><button id="lockNowButton" type="button" aria-label="Lock now" title="Lock now"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span class="visually-hidden" data-zh="立即锁定" data-en="Lock now"></span></button></div>
    </header>
    <main>
        <section class="panel" id="loginBox" aria-labelledby="loginStepTitle" hidden>
            <div class="hero"><div class="hero-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="m4 8 8 5 8-5"/></svg></div><div class="panel-heading"><h2 class="step" id="loginStepTitle"></h2><p class="description" data-zh="使用邮箱验证码登录。" data-en="Sign in with an email verification code."></p></div></div>
            <label class="field"><span data-zh="邮箱地址" data-en="Email address"></span><input type="email" id="email" autocomplete="off" placeholder="Email"></label>
            <div class="field"><label for="code" data-zh="邮箱验证码" data-en="Verification code"></label><div class="row"><input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Code"><button class="secondary" id="sendCodeButton" type="button"></button></div></div>
            <button class="primary" id="loginButton" type="button"></button>
        </section>
        <section class="panel" id="vaultBox" aria-labelledby="vaultStepTitle" hidden>
            <div class="hero"><div class="hero-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="8" cy="14" r="4"/><path d="m11 11 8-8M15 7l2.5 2.5M18 4l2 2"/></svg></div><div class="panel-heading"><h2 class="step" id="vaultStepTitle"></h2><p class="description" data-zh="连接此浏览器使用的密码库。" data-en="Connect a vault to this browser."></p></div></div>
            <div id="vaultList"></div>
            <button class="secondary" id="cancelVaultSwitchButton" type="button" data-zh="取消切换" data-en="Cancel switch" hidden></button>
            <div id="createVaultForm" hidden>
                <label class="field"><span data-zh="密码库名称" data-en="Vault name"></span><input type="text" id="newVaultName" autocomplete="off" placeholder="Main"></label>
                <label class="field"><span data-zh="主密码" data-en="Master password"></span><input type="password" id="newVaultPassword" autocomplete="new-password"></label>
                <label class="field"><span data-zh="确认主密码" data-en="Confirm master password"></span><input type="password" id="newVaultPasswordConfirm" autocomplete="new-password"></label>
                <button class="primary" id="createVaultButton" type="button" data-zh="创建密码库" data-en="Create vault"></button>
            </div>
        </section>
        <section class="panel" id="unlockBox" aria-labelledby="unlockStepTitle" hidden>
            <div class="hero"><div class="hero-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15" r="1.4"/></svg></div><div class="panel-heading"><h2 class="step" id="unlockStepTitle"></h2><p class="description" data-zh="输入主密码，在本机解锁。" data-en="Enter your master password to unlock locally."></p></div></div>
            <label class="field"><span data-zh="主密码" data-en="Master password"></span><input type="password" id="masterPassword" autocomplete="off"></label>
            <button class="primary" id="unlockButton" type="button"></button>
            <p class="unlock-note" data-zh="切换页签不会锁定，闲置后自动锁定。" data-en="Switching tabs keeps your vault unlocked. It locks after inactivity."></p>
        </section>
        <section id="itemsBox" aria-labelledby="itemsHeading" hidden>
            <label class="search"><span class="visually-hidden" data-zh="搜索条目" data-en="Search items"></span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><input type="search" id="searchItems" autocomplete="off"></label>
            <div class="toolbar">
                <label class="visually-hidden" for="siteFilter" data-zh="筛选条目" data-en="Filter items"></label>
                <span class="select-shell"><select id="siteFilter" aria-label="Filter items"><option value="all" data-zh="全部网站" data-en="All sites"></option><option value="current" data-zh="当前网站" data-en="Current site"></option><option value="favorites" data-zh="收藏" data-en="Favorites"></option></select></span>
                <label class="visually-hidden" for="sortItems" data-zh="排序条目" data-en="Sort items"></label>
                <span class="select-shell"><select id="sortItems" aria-label="Sort items"><option value="title" data-zh="标题 A–Z" data-en="Title A–Z"></option><option value="title-desc" data-zh="标题 Z–A" data-en="Title Z–A"></option></select></span>
                <button id="newLoginButton" type="button" data-zh="新建登录" data-en="New login"></button>
            </div>
            <p id="syncSummary" class="sync-summary" aria-live="polite"></p>
            <section class="site-context" id="siteContext" hidden><div class="site-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a18 18 0 0 1 0 18 18 18 0 0 1 0-18Z"/></svg></div><div class="site-copy"><span class="site-caption" data-zh="当前页面 · 点此快速填充匹配项" data-en="Current page · click to fill the first match"></span><div class="host" id="host"></div></div></section>
            <section class="suggestion-section" id="suggestionSection" aria-labelledby="suggestionHeading" hidden><div class="list-heading"><h2 id="suggestionHeading" data-zh="当前网站" data-en="Autofill suggestions"></h2></div><ul id="suggestions"></ul></section>
            <div class="list-heading"><h2 id="itemsHeading" data-zh="全部条目" data-en="All items"></h2><span id="resultCount" aria-live="polite">0</span></div>
            <ul id="items"></ul>
            <div class="empty-state" id="emptyState" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><h3 id="emptyTitle"></h3><p id="emptyDescription"></p><button class="secondary" id="emptyNewLoginButton" type="button" data-zh="新建登录" data-en="New login" hidden></button></div>
        </section>
        <section class="panel" id="detailBox" aria-labelledby="detailHeading" hidden>
            <div class="detail-actions"><button class="secondary" id="detailBackButton" type="button" data-zh="返回" data-en="Back"></button><button class="secondary" id="detailEditButton" type="button" data-zh="编辑" data-en="Edit"></button><button class="secondary" id="detailCancelButton" type="button" data-zh="取消" data-en="Cancel" hidden></button></div>
            <h2 class="step" id="detailHeading" data-zh="条目详情" data-en="Item details"></h2>
            <p class="description" id="detailLegacyNote" data-zh="此条目仅可查看：缺少可安全编辑的原始数据。请在 App 中编辑，或重新同步。" data-en="View only: original data for safe editing is unavailable. Edit in the app or sync again." hidden></p>
            <div id="detailContent"></div>
            <div id="detailSaveSection" hidden><p class="description" data-zh="保存会在本机加密并更新云端条目。请重新输入主密码授权；不会保存主密码或编辑草稿。" data-en="Saving encrypts this item locally and updates it in the cloud. Enter your master password again to authorize; the password and edit draft are never stored."></p><label class="field"><span data-zh="主密码（仅用于此次保存）" data-en="Master password (this save only)"></span><input type="password" id="detailMasterPassword" autocomplete="off"></label><button class="primary" id="detailSaveButton" type="button" data-zh="加密并保存" data-en="Encrypt and save"></button></div>
        </section>
        <section class="panel" id="generatorBox" aria-labelledby="generatorHeading" hidden>
            <div class="panel-heading"><h2 class="step" id="generatorHeading" data-zh="密码生成器" data-en="Password generator"></h2><p class="description" data-zh="生成的密码仅保留在此弹窗内存中。" data-en="Generated passwords stay in this popup’s memory only."></p></div>
            <label class="field"><span data-zh="长度（8–128）" data-en="Length (8–128)"></span><input id="generatorLength" type="number" min="8" max="128" value="20" inputmode="numeric"></label>
            <div class="generator-options"><label class="check-row"><input id="genUppercase" type="checkbox" checked><span data-zh="大写字母" data-en="Uppercase"></span></label><label class="check-row"><input id="genLowercase" type="checkbox" checked><span data-zh="小写字母" data-en="Lowercase"></span></label><label class="check-row"><input id="genDigits" type="checkbox" checked><span data-zh="数字" data-en="Digits"></span></label><label class="check-row"><input id="genSymbols" type="checkbox" checked><span data-zh="符号" data-en="Symbols"></span></label></div>
            <button class="secondary" id="regenerateButton" type="button" data-zh="重新生成" data-en="Regenerate"></button>
            <label class="field"><span data-zh="生成的密码" data-en="Generated password"></span><input id="generatedPassword" type="password" readonly autocomplete="off"></label>
            <div class="row"><button class="secondary" id="revealGeneratedButton" type="button" aria-pressed="false" data-zh="显示密码" data-en="Reveal password"></button><button class="secondary" id="copyGeneratedButton" type="button" data-zh="复制" data-en="Copy"></button></div>
            <button class="primary" id="useGeneratedButton" type="button" data-zh="用于新登录" data-en="Use in new login"></button>
            <p class="clip-note" data-zh="复制内容会留在剪贴板，直到被其他内容覆盖；关闭弹窗后无法可靠自动清除。" data-en="Copied content stays on your clipboard until overwritten; it cannot be reliably cleared after this popup closes."></p>
        </section>
        <section class="panel" id="newLoginBox" aria-labelledby="newLoginHeading" hidden>
            <div class="detail-actions"><button class="secondary" id="newLoginBackButton" type="button" data-zh="返回" data-en="Back"></button></div>
            <h2 class="step" id="newLoginHeading" data-zh="新建登录" data-en="New login"></h2>
            <p class="privacy-note" data-zh="草稿仅保留在此弹窗内存中。返回或关闭弹窗将丢弃未保存内容。" data-en="This draft exists only in popup memory. Going back or closing the popup discards unsaved changes."></p>
            <label class="field"><span data-zh="标题" data-en="Title"></span><input id="newLoginTitle" autocomplete="off"></label>
            <label class="field"><span data-zh="用户名" data-en="Username"></span><input id="newLoginUsername" autocomplete="off"></label>
            <label class="field"><span data-zh="密码" data-en="Password"></span><input id="newLoginPassword" type="password" autocomplete="new-password"></label>
            <label class="field"><span data-zh="网站地址" data-en="Website URL"></span><input id="newLoginUrl" type="url" autocomplete="url"></label>
            <label class="field"><span data-zh="备注" data-en="Notes"></span><textarea id="newLoginNotes" rows="3"></textarea></label>
            <label class="field"><span data-zh="主密码（确认保存）" data-en="Master password (confirm save)"></span><input id="newLoginMasterPassword" type="password" autocomplete="off"></label>
            <button class="primary" id="createLoginSaveButton" type="button" data-zh="加密并创建" data-en="Encrypt and create"></button>
        </section>
        <section id="settingsBox" aria-labelledby="settingsHeading" hidden>
            <div class="panel-heading"><h2 class="step" id="settingsHeading" data-zh="设置" data-en="Settings"></h2><p class="description" data-zh="选择密码库自动锁定前的闲置时间。" data-en="Choose how long to wait before locking your vault after inactivity."></p></div>
            <label class="setting-row" for="lockTimeout"><span data-zh="闲置自动锁定" data-en="Lock after inactivity"></span><span class="select-shell"><select id="lockTimeout"><option value="5" data-zh="5 分钟" data-en="5 minutes">5 minutes</option><option value="15" data-zh="15 分钟" data-en="15 minutes">15 minutes</option><option value="30" data-zh="30 分钟" data-en="30 minutes">30 minutes</option><option value="60" data-zh="60 分钟" data-en="60 minutes">60 minutes</option></select></span></label>
            <p id="persistenceNote" data-zh="设置保存在此浏览器中。" data-en="Settings are saved in this browser."></p>
            <p id="sessionMode"></p>
            <p id="accountInfo"></p>
            <p id="settingsSyncStatus" role="status" aria-live="polite"></p>
            <p id="clipboardNote" class="clip-note" data-zh="复制密码后会由浏览器暂存；关闭弹窗后不保证能自动清除。" data-en="Copied passwords are held by the browser clipboard; automatic clearing after popup close is not guaranteed."></p>
        </section>
        <div id="status" class="muted" role="status" aria-live="polite"></div>
    </main>
    <nav id="navigation" aria-label="Main navigation" hidden>
        <button id="vaultTab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span data-zh="密码库" data-en="Vault">Vault</span></button>
        <button id="generatorTab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9.5v.01M12 9.5v.01M16 9.5v.01M8 14.5v.01M12 14.5v.01M16 14.5v.01" stroke-width="2.4"/></svg><span data-zh="生成器" data-en="Generator">Generator</span></button>
        <button id="settingsTab" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.4M12 18.1v2.4M3.5 12h2.4M18.1 12h2.4M6 6l1.7 1.7M16.3 16.3 18 18M18 6l-1.7 1.7M7.7 16.3 6 18"/></svg><span data-zh="设置" data-en="Settings">Settings</span></button>
    </nav>
    <footer class="footer" id="footer" hidden><button id="refreshButton" type="button" data-zh="同步" data-en="Sync"></button><button id="lockButton" type="button" data-zh="退出登录" data-en="Sign out"></button></footer>
    <script type="module" src="popup.js"></script>
</body>
</html>
