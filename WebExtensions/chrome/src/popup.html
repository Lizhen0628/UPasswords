<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font: 13px -apple-system, sans-serif; width: 300px; margin: 0; padding: 12px; }
        h1 { font-size: 14px; margin: 0 0 4px; }
        .host { color: #666; word-break: break-all; margin-bottom: 8px; }
        .muted { color: #888; }
        ul { list-style: none; padding: 0; margin: 8px 0 0; }
        li.item {
            padding: 8px 10px; border-radius: 8px; cursor: pointer;
            display: flex; flex-direction: column; gap: 2px;
        }
        li.item:hover { background: rgba(128, 128, 128, 0.15); }
        li.item .title { font-weight: 600; }
        li.item .user { color: #666; font-size: 12px; }
        .panel { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        /* .panel 的 display:flex 会盖过 UA 的 [hidden],必须显式压制——
           否则邮箱验证与主密码两块永远同页堆叠 */
        [hidden] { display: none !important; }
        .step { font-weight: 600; font-size: 13px; }
        button.vault-row {
            display: flex; flex-direction: column; gap: 2px; text-align: left;
            padding: 8px 10px; border: 1px solid rgba(128, 128, 128, 0.4);
            border-radius: 8px; background: transparent; color: inherit;
            font: inherit; cursor: pointer;
        }
        button.vault-row:hover { background: rgba(128, 128, 128, 0.15); }
        button.vault-row .count { color: #888; font-size: 12px; font-weight: 400; }
        .panel input, .panel select {
            font: inherit; padding: 7px 10px; border-radius: 8px;
            border: 1px solid rgba(128, 128, 128, 0.4); background: transparent; color: inherit;
        }
        .panel button {
            font: inherit; font-weight: 600; padding: 7px 10px; border: 0;
            border-radius: 8px; cursor: pointer; color: #fff; background: #0a84ff;
        }
        .panel button:disabled { opacity: 0.5; cursor: default; }
        .row { display: flex; gap: 8px; }
        .row > * { flex: 1; }
        .error { color: #ff453a; font-size: 12px; }
        .ok { color: #30d158; font-size: 12px; }
        .footer { display: flex; justify-content: space-between; margin-top: 10px; }
        .footer button {
            font: inherit; font-size: 12px; padding: 4px 10px; border: 0;
            border-radius: 6px; cursor: pointer;
            background: rgba(128, 128, 128, 0.2); color: inherit;
        }
    </style>
</head>
<body>
    <h1>UPasswords</h1>
    <div class="host" id="host">…</div>
    <div id="status" class="muted"></div>

    <!-- 第 1 页:邮箱验证(独立数据通路,不依赖桌面 App) -->
    <div class="panel" id="loginBox" hidden>
        <div class="step" id="loginStepTitle"></div>
        <input type="email" id="email" autocomplete="off" placeholder="邮箱">
        <div class="row">
            <input type="text" id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="验证码">
            <button id="sendCodeButton" type="button">发送验证码</button>
        </div>
        <button id="loginButton" type="button">登录</button>
    </div>

    <!-- 第 2 页:选择密码库;新账户无库时转为创建表单 -->
    <div class="panel" id="vaultBox" hidden>
        <div class="step" id="vaultStepTitle"></div>
        <div id="vaultList"></div>
        <div id="createVaultForm" hidden>
            <input type="text" id="newVaultName" autocomplete="off" placeholder="库名（如 Main）">
            <input type="password" id="newVaultPassword" autocomplete="new-password" placeholder="主密码">
            <input type="password" id="newVaultPasswordConfirm" autocomplete="new-password" placeholder="确认主密码">
            <button id="createVaultButton" type="button">创建密码库</button>
        </div>
    </div>

    <!-- 第 3 页:主密码解锁(每次解锁都从云端拉最新信封+条目) -->
    <div class="panel" id="unlockBox" hidden>
        <div class="step" id="unlockStepTitle"></div>
        <input type="password" id="masterPassword" autocomplete="off" placeholder="主密码">
        <button id="unlockButton" type="button">解锁</button>
    </div>

    <ul id="items"></ul>
    <div class="footer" id="footer" hidden>
        <button id="refreshButton" type="button"></button>
        <button id="lockButton" type="button"></button>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
